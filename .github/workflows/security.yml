name: Security

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The action passes continueOnError to the artifact client, but
          # @actions/artifact still rethrows on FinalizeArtifact. A transient
          # 403 from GitHub's artifact service therefore fails the job even
          # when the scan found nothing. Only the scan result should decide
          # this job's status, so the best-effort SARIF upload is skipped.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python,javascript-typescript
      - uses: github/codeql-action/analyze@v3

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit
      - name: Audit API Python dependencies
        run: pip-audit -r apps/api/requirements.txt
      - name: Audit CLI Python dependencies
        working-directory: apps/cli
        run: |
          # pip-audit with no arguments audits the whole environment, so the
          # runner's own pip is included: keep it current or its advisories
          # fail the job. (Dependencies resolve fresh from the >= ranges.)
          python -m pip install --upgrade pip setuptools
          python -m pip install -e .
          pip-audit
      # Production dependencies are gated strictly. Dev-only advisories are
      # reported below without failing the build: they never ship in the
      # frontend bundle or the Action dist, and some (e.g. braces via
      # eslint-config-next) have no published fix yet — `npm audit fix --force`
      # would only downgrade the toolchain. Production audit is the gate.
      - name: Audit web npm production dependencies
        working-directory: apps/web
        run: npm audit --omit=dev --audit-level=high
      - name: Audit GitHub Action npm production dependencies
        working-directory: packages/github-action
        run: npm audit --omit=dev --audit-level=high
      - name: Report web npm development advisories (non-blocking)
        working-directory: apps/web
        continue-on-error: true
        run: npm audit --audit-level=high
      - name: Report GitHub Action npm development advisories (non-blocking)
        working-directory: packages/github-action
        continue-on-error: true
        run: npm audit --audit-level=high

  trivy:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
