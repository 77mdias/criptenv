name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  python-lint:
    name: Python lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff (API)
        run: ruff check apps/api/app apps/api/tests
      - name: Ruff (CLI)
        run: ruff check apps/cli/src apps/cli/tests

  migrations:
    name: Alembic single head
    runs-on: ubuntu-latest
    env:
      # Settings() is instantiated when a migration imports app.config, and
      # DATABASE_URL/SECRET_KEY are required fields with no defaults. `alembic
      # heads` never connects; the blank-database check connects to the
      # postgres service below through DATABASE_URL.
      DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci_placeholder
      SECRET_KEY: ci-migration-head-check-secret-key-32-chars
    services:
      # Blank database for the bootstrap check below (same major as deploy/vps).
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_placeholder
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install migration dependencies
        # The migrations import app.config (pydantic-settings) and the models,
        # so the full API requirements are needed — installing only
        # alembic+sqlalchemy fails with ModuleNotFoundError at import time.
        run: pip install -r apps/api/requirements.txt
      - name: Verify exactly one migration head
        working-directory: apps/api
        run: |
          set -eu
          heads=$(alembic -c alembic.ini heads | grep -c "(head)")
          echo "heads=$heads"
          if [ "$heads" -ne 1 ]; then
            echo "::error::Expected exactly one Alembic head, found $heads (multiple heads break 'upgrade head')"
            exit 1
          fi
      - name: Migrate a blank database like the container entrypoint
        # A fresh self-host runs scripts/migrate.py on an empty database; the
        # second run takes the normal `upgrade head` path, and `alembic check`
        # proves the bootstrapped schema matches the models.
        working-directory: apps/api
        run: |
          set -eu
          python scripts/migrate.py
          python scripts/migrate.py
          alembic check

  api:
    name: API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # `make api-test` runs `make api-install`, which installs
      # apps/api/requirements-dev.txt into apps/api/.venv — including
      # aiosqlite, required by the non-mocked regression suites (API key eager
      # loading, vault OCC concurrency). Without it those tests silently skip.
      - name: Run API tests
        run: make api-test

  cli:
    name: CLI tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run CLI tests
        run: make cli-test

  web:
    name: Web lint, tests, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Run web lint
        run: make web-lint
      - name: Check sitemap is up to date
        working-directory: apps/web
        run: npm run check:sitemap
      - name: Run web unit tests
        run: make web-test-unit
      - name: Run Vinext compatibility check
        run: make web-check-vinext
      - name: Build web
        run: make web-build

  github-action:
    name: GitHub Action package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"  # same runtime as action.yml runs.using
          cache: npm
          cache-dependency-path: packages/github-action/package-lock.json
      - name: Install action dependencies
        working-directory: packages/github-action
        run: npm ci
      - name: Lint action
        working-directory: packages/github-action
        run: npm run lint
      - name: Test action
        working-directory: packages/github-action
        run: npm test
      - name: Typecheck action
        working-directory: packages/github-action
        run: npx tsc --noEmit
      - name: Build action bundle
        working-directory: packages/github-action
        run: npm run build
      - name: Verify action bundle is committed
        run: git diff --exit-code -- packages/github-action/dist
