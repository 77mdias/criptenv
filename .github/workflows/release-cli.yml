name: Release CLI

# Publishes apps/cli to PyPI when a `cli-vX.Y.Z` tag is pushed.
# Uses PyPI Trusted Publishing (OIDC), so no API token is stored in GitHub.
# One-time setup on pypi.org → criptenv → Publishing: owner 77mdias,
# repo criptenv, workflow release-cli.yml, environment pypi.

on:
  push:
    tags:
      - "cli-v*"

permissions:
  contents: read

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Tag must match pyproject version
        working-directory: apps/cli
        run: |
          version=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "cli-v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} != pyproject version ${version}"
            exit 1
          fi
      - name: Run CLI tests
        run: make cli-test
      - name: Build sdist and wheel
        working-directory: apps/cli
        run: |
          pip install build
          python -m build --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: cli-dist
          path: apps/cli/dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cli-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  image:
    # Single-binary CLI (no Python at runtime): image on GHCR + binary on the GitHub Release.
    name: Publish binary and image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub Release
      packages: write   # push to ghcr.io
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#cli-v}" >> "$GITHUB_OUTPUT"
      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/cli/Dockerfile
          target: runtime
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/criptenv-cli:${{ steps.ver.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/criptenv-cli:latest
          cache-from: type=gha,scope=cli
          cache-to: type=gha,mode=max,scope=cli
      - name: Extract binary
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/cli/Dockerfile
          target: binary
          outputs: type=local,dest=out
          cache-from: type=gha,scope=cli
      - name: Create GitHub Release with the binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv out/criptenv out/criptenv-linux-x86_64
          (cd out && sha256sum criptenv-linux-x86_64 > criptenv-linux-x86_64.sha256)
          gh release create "$GITHUB_REF_NAME" out/criptenv-linux-x86_64 out/criptenv-linux-x86_64.sha256 \
            --title "CriptEnv CLI ${GITHUB_REF_NAME#cli-v}" --generate-notes --latest
