name: Release CLI

# Publishes apps/cli to PyPI when a `cli-vX.Y.Z` tag is pushed.
# Uses PyPI Trusted Publishing (OIDC), so no API token is stored in GitHub.
# One-time setup on pypi.org → criptenv → Publishing: owner 77mdias,
# repo criptenv, workflow release-cli.yml, environment pypi.

on:
  push:
    tags:
      - "cli-v*"

permissions:
  contents: read

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Tag must match pyproject version
        working-directory: apps/cli
        run: |
          version=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "cli-v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} != pyproject version ${version}"
            exit 1
          fi
      - name: Run CLI tests
        run: make cli-test
      - name: Build sdist and wheel
        working-directory: apps/cli
        run: |
          pip install build
          python -m build --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: cli-dist
          path: apps/cli/dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cli-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
