title = "CriptEnv Gitleaks Config"

# Extend the built-in ruleset. Without this section the default rules are
# REPLACED, not extended, which left the scan with zero detection rules and let a
# committed session token (cookies.txt) pass CI unnoticed.
[extend]
useDefault = true

[allowlist]
description = "Ignore documentation placeholders and examples"
regexes = [
  # Placeholders used in API documentation examples
  '''<YOUR_API_KEY>''',
  '''<SESSION_TOKEN>''',
  '''<CI_TOKEN>''',
  '''<ADMIN_API_KEY>''',
  # Generic placeholder patterns commonly used in docs
  '''<API_KEY>''',
  '''<TOKEN>''',
  '''<SECRET>''',
]

paths = [
  # Local curl cookie jars contain live session tokens.
  '''(^|/)cookies\.txt$''',
]
