    /* One number drives the loop: --p runs 0 → 1 over the 16 s (the script below) and every

      inset: 0;

        calc(sin(var(--p) * 2turn + 0.6rad) * var(--k) * 0.5px);
    }

    #hero-glow {

    #hero-crystal {

      z-index: 2;
      rotate: calc(sin(var(--p) * 1turn + 1rad) * 2.5deg);
    }
    #hero-core {

      width: 100%;
      height: 100%;
    }
    #hero-seam {
      opacity: calc(var(--beat) * var(--beat) * var(--beat) * 0.95);
    }

    /* A piece turns once around the shard per loop, on the ellipse that passes through where
       it sits in the source image (--r, --th, --q), near side left to right. It is larger,
       brighter and in front of the crystal on the near half, behind it on the far half. */
    .hero-frag {
      position: absolute;
      left: 0;
      top: 0;
      background: url(assets/shard-pieces.webp) no-repeat;
      background-size: var(--sheet);
      --a: calc(var(--th) * 1rad - var(--p) * 1turn);
      --u: calc(cos(var(--a)) * var(--r));
      --v: calc(sin(var(--a)) * var(--r) * var(--q) + sin((var(--p) * 2 + var(--ph)) * 1turn) * var(--bob));
      translate: calc((var(--u) * var(--ca) - var(--v) * var(--sa)) * 1px)
        calc((var(--u) * var(--sa) + var(--v) * var(--ca)) * 1px);
      /* --depth: how much larger a piece is on the near side; 1 where it sits in the source */
      scale: calc((1 + sin(var(--a)) * var(--depth)) / (1 + sin(var(--th) * 1rad) * var(--depth)));
      rotate: calc(sin((var(--p) + var(--ph)) * 1turn) * var(--rot) * 1deg);
      opacity: calc(0.78 + sin(var(--a)) * 0.22);
      z-index: calc(2 + clamp(-1, sin(var(--a)) * 1000, 1));
    }

    /* Out-of-focus flakes between the camera and the shard. Each depth is two copies half a
       loop apart, one mirrored: a copy fades in, drifts --wx / --wy px and fades out while the
       other takes over, so the drift never reverses and never jumps. Dimmed on the left,
       where the page sets its headline. */

      inset: 0;

    }

      opacity: calc(sin(var(--w) * 0.5turn) * sin(var(--w) * 0.5turn) * var(--o));
